name: CI

on:
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  phpcs:
    name: Check PHPCS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: phpcs

      - name: Run PHPCS Scan
        id: phpcs_scan
        shell: bash
        run: |
          set +e

          phpcs \
            --standard=PSR2 \
            --ignore='*/app/Http/Middleware/TrustProxies.php,*/app/Console/Kernel.php' \
            app \
            > phpcs-output.txt 2>&1

          status=$?
          cat phpcs-output.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "has_errors=true"
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_errors=false"
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare PHPCS PR comment
        if: always() && steps.phpcs_scan.outputs.has_errors == 'true'
        shell: bash
        run: |
          {
            echo "## PHPCS failed"
            echo
            echo "Commit: \`${{ github.event.pull_request.head.sha }}\`"
            echo
            echo '```text'
            cat phpcs-output.txt
            echo '```'
          } > phpcs-comment.md

      - name: Comment PHPCS result
        if: always() && steps.phpcs_scan.outputs.has_errors == 'true'
        uses: mshick/add-pr-comment@v3
        with:
          message-id: ci-phpcs
          message-path: phpcs-comment.md
          refresh-message-position: true

      - name: Fail Build if PHPCS failed
        if: always() && steps.phpcs_scan.outputs.has_errors == 'true'
        shell: bash
        run: |
          cat phpcs-output.txt
          exit "${{ steps.phpcs_scan.outputs.exit_code }}"

  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run commitlint
        id: commitlint_scan
        shell: bash
        run: |
          set +e

          COMMIT_MESSAGE="$(git log -1 --pretty=%B)"
          echo "$COMMIT_MESSAGE" | npx --yes @commitlint/cli@19 --config .commitlintrc.js > commitlint-output.txt 2>&1

          status=$?
          cat commitlint-output.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "is_invalid=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_invalid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare commitlint PR comment
        if: always() && steps.commitlint_scan.outputs.is_invalid == 'true'
        shell: bash
        run: |
          {
            echo "## Commit lint failed"
            echo
            echo "Latest commit message:"
            echo
            echo '```text'
            git log -1 --pretty=%B
            echo '```'
            echo
            echo "commitlint output:"
            echo
            echo '```text'
            cat commitlint-output.txt
            echo '```'
          } > commitlint-comment.md

      - name: Comment commitlint result
        if: always() && steps.commitlint_scan.outputs.is_invalid == 'true'
        uses: mshick/add-pr-comment@v3
        with:
          message-id: ci-commitlint
          message-path: commitlint-comment.md
          refresh-message-position: true

      - name: Fail Build if commitlint failed
        if: always() && steps.commitlint_scan.outputs.is_invalid == 'true'
        shell: bash
        run: |
          cat commitlint-output.txt
          exit "${{ steps.commitlint_scan.outputs.exit_code }}"
