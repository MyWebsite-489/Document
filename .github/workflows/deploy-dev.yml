name: Deploy Dev

on:
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

  # Enable this again later if dev deploy should run after CI on develop.
  # workflow_run:
  #   workflows:
  #     - CI
  #   types:
  #     - completed
  #   branches:
  #     - develop

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    # Enable this again when this workflow performs the real dev deploy.
    # environment:
    #   name: dev

    steps:
      - name: Checkout workflow run commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout pull request commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout selected commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          extensions: zip, gd, bcmath
          tools: composer:v2

      - name: Install deploy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssh-client rsync unzip zip

      - name: Install Composer Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          composer dump-autoload --no-interaction --optimize

      - name: Create env and health check file
        env:
          DEV_DEPLOY_ENV_FILE: ${{ secrets.DEV_DEPLOY_ENV_FILE }}
        run: |
          if [ -n "$DEV_DEPLOY_ENV_FILE" ]; then
            printf '%s' "$DEV_DEPLOY_ENV_FILE" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          echo "OK" > public/health.html

      - name: Configure SSH
        if: github.event_name == 'workflow_dispatch'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}

      - name: Setup SSH Config
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/config <<'EOF'
          Host *
              StrictHostKeyChecking no
              ControlMaster auto
              ControlPath /tmp/ansible-%r@%h:%p
              ControlPersist 15m
              PreferredAuthentications publickey
          EOF
          chmod go-wrx ~/.ssh
          chmod 600 ~/.ssh/config

